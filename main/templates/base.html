{% load static %}

<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Portfolio
        {% endblock %}
    </title>

    <meta name="description" content="Personal portfolio and interactive projects">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>

    <!-- Background -->
    <div class="background-grid"></div>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>


    <!-- NAVBAR -->

    <header class="navbar">

        <a href="{% url 'main:home' %}" class="logo">

            <span class="logo-symbol">&lt;/&gt;</span>

            <span>DEV</span>

        </a>

        <nav class="nav-links">

            <a href="{% url 'main:home' %}">
                Home
            </a>

            <a href="{% url 'main:projects' %}">
                Projects
            </a>

            <a href="{% url 'main:lab' %}">
                Lab
            </a>

            <a href="{% url 'main:about' %}">
                About
            </a>

            <a href="{% url 'main:contact' %}">
                Contact
            </a>

        </nav> 
        
        <button class="theme-btn" id="themeBtn" aria-label="Toggle theme">
            ☾
        </button>


        <button class="mobile-menu" id="mobileMenu">
            ☰
        </button>

    </header>


    <!-- MAIN -->

    <main>

        {% block content %}
        {% endblock %}

    </main>


    

<footer class="footer">

    <div>

        <strong>
            &lt;/&gt; DEV
        </strong>

        <p>
            Building digital experiences.
        </p>

    </div>


    <div class="footer-links">

        <a href="{% url 'main:projects' %}">
            Projects
        </a>

        <a href="{% url 'main:lab' %}">
            Lab
        </a>

        <a href="{% url 'main:contact' %}">
            Contact
        </a>

    </div>


    <div class="footer-status">

        <span class="status-dot"></span>

        SYSTEM ONLINE

    </div>

</footer>


    <script src="{% static 'js/main.js' %}"></script>

</body>

</html>
